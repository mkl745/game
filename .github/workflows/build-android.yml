name: Build Android APK
on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          GODOT_VERSION=4.3-stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. ~/.local/share/godot/export_templates/${GODOT_VERSION}/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages and signing key
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SDKMANAGER" ]; then "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'cmdline-tools;latest'; else echo "No sdkmanager found; using runner-preinstalled Android SDK packages"; find "$ANDROID_HOME" -maxdepth 3 -type d | head -30; fi
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Validate data and load project headlessly
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = {p.stem: json.loads(p.read_text()) for p in pathlib.Path('data').glob('*.json')}
          assert len(data['characters']) >= 14
          assert len(data['events']) >= 10
          for person in data['characters'].values():
              assert person['name'] and person['likes'] and person['schedule']
          for event in data['events']:
              assert event['title'] and len(event['choices']) >= 2
          print('Data sanity checks passed')
          PY
          godot --headless --path . --editor --quit
          godot --headless --path . --quit-after 3
      - name: Configure Android export settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          EOF
      - name: Export signed Android APK
        run: |
          mkdir -p build
          sed -i "s/version\/code=1/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          set -o pipefail
          godot --headless --path . --verbose --export-debug Android build/teachers-pet.apk 2>&1 | tee build/export.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teachers-pet-build-diagnostics
          path: build/export.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: teachers-pet-apk
          path: build/teachers-pet.apk
          if-no-files-found: error
